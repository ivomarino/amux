[workspace]
resolver = "2"
members = [
    "crates/amux-core",
    "crates/amux-server",
    "crates/amux-cli",
    "crates/amux-dashboard",
]

# Workspace-wide dependency versions: every crate inherits from here so the
# whole system agrees on one version of each concern (RR-0001).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
thiserror = "2"
anyhow = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rust-embed = "8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
cron = "0.12"
proptest = "1"
tempfile = "3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
futures = "0.3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Fast iteration: thin LTO only for release, debug builds favor compile speed.
[profile.release]
lto = "thin"
strip = "symbols"
