# Per-user docker-compose — instantiated by gateway.py
# Variables replaced: USER_ID, USER_PORT, CF_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY, R2_ENDPOINT

services:
  amux:
    image: ghcr.io/mixpeek/amux:latest
    container_name: amux-user-${USER_ID}
    restart: unless-stopped
    # MEMORY CAP (AC-229). On 2026-08-06 the host OOM-killed `claude` four times
    # between 03:40 and 13:09, every event `constraint=CONSTRAINT_NONE` — a GLOBAL
    # kill, because nothing in this file capped anything. Under a global OOM the
    # kernel picks by badness score, not by culpability, so at 09:41 it took
    # amux-gateway.service — the process fronting EVERY tenant. One tenant's memory
    # became a fleet-wide outage: TLS never completed, sshd accepted then dropped,
    # tailscaled died, and journald hung >122s so nothing even reached Cloud Logging.
    # A cap does not stop a container using too much; it makes that container the
    # thing that dies instead of the box. A dead workspace is a bug; a dead host is
    # an outage — the same reasoning already written on the watchdog below.
    # RAISED 1500m -> 3g the same day, because 1500m produced a DIFFERENT outage.
    # The workspace sat pinned at 1.465GiB/1.465GiB (99.98%) with OOMKilled=false:
    # it never exceeded the cap, so nothing was killed and nothing restarted. It
    # just lived at the ceiling, reclaiming constantly, too slow to answer the 3s
    # healthcheck — 78 consecutive failures, permanently "unhealthy", and the
    # gateway served the Starting page / 502 to every request. Raising the cap
    # live dropped it to 485MiB (15.79%) and it went healthy within 45s.
    #
    # So the steady state is ~485MB and the original sizing was not wrong about
    # RSS; what it missed is a transient startup spike ABOVE 1.5g that the
    # container could never complete while pinned. The failure mode is worth
    # naming: a cap set just under a spike does not kill the container, it
    # SUSPENDS it — which is harder to diagnose than an OOM kill, because there
    # is no kill to find and the container looks up the whole time.
    #
    # 3g keeps the original property (a runaway workspace dies before the host
    # does) with real headroom over the spike. Host is 7.9GB, so ~2 concurrent
    # workspaces fit; the AC-231 herd-break means containers start on demand
    # rather than all at boot, which is what makes that budget hold.
    mem_limit: 3g
    memswap_limit: 3g
    volumes:
      - root-home:/root
      - amux-data:/root/.amux
      - /opt/amux-cloud/app/amux-server.py:/app/amux-server.py:ro
      - /opt/amux-cloud/app/icon.svg:/app/icon.svg:ro
      - /opt/amux-cloud/app/icon.png:/app/icon.png:ro
      - /opt/amux-cloud/app/icon-192.png:/app/icon-192.png:ro
      - /opt/amux-cloud/app/icon-512.png:/app/icon-512.png:ro
    environment:
      AMUX_PORT: "8822"
      AMUX_AUTH_TOKEN: "none"
      POSTHOG_KEY: "${POSTHOG_KEY}"
      POSTHOG_HOST: "${POSTHOG_HOST}"
    ports:
      # SECURITY: bind loopback-only. Inside the container AMUX_AUTH_TOKEN is
      # "none" (no per-request auth — the gateway is the trust boundary), so a
      # 0.0.0.0 publish let one tenant's container reach another's over the
      # docker bridge (172.17.0.1:<other_port>) → cross-tenant unauth RCE. The
      # gateway already proxies to 127.0.0.1:<port>, so loopback-only is enough.
      - "127.0.0.1:${USER_PORT}:8822"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8822/api/sessions"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  watchdog:
    image: ghcr.io/mixpeek/amux:latest
    container_name: amux-watchdog-${USER_ID}
    # Capped for the same reason its restart policy is (AC-162/AC-163): this
    # sidecar has already taken the host down once. A python health loop needs
    # nothing like this much.
    mem_limit: 192m
    memswap_limit: 192m
    # on-failure:5, NOT unless-stopped. A sidecar that fails instantly under
    # unless-stopped is a self-DoS on the shared daemon: this one exited 1 on
    # every start, was restarted with no backoff 4318 times, and the
    # task-create/delete churn saturated dockerd until the whole HOST went dark
    # — docker ps timing out, sshd starved, every tenant's workspace 503
    # (AC-162/AC-163). Capping it means a broken watchdog degrades its own
    # workspace's monitoring and then STOPS, loudly, instead of taking the box
    # down with it. A dead sidecar is a bug; a dead host is an outage.
    restart: on-failure:5
    volumes:
      - amux-data:/root/.amux
      - /opt/amux-cloud/app/amux-server.py:/app/amux-server.py:ro
      - /opt/amux-cloud/app/scripts/watchdog.py:/app/scripts/watchdog.py:ro
    environment:
      AMUX_PORT: "8822"
      WATCHDOG_HEALTH_URL: "http://amux:8822/health"
      WATCHDOG_AMUX_DIR: "/app"
      WATCHDOG_INTERVAL: "30"
    entrypoint: ["python", "/app/scripts/watchdog.py"]
    depends_on:
      amux:
        condition: service_healthy

  litestream:
    image: litestream/litestream:latest
    container_name: amux-litestream-${USER_ID}
    # SQLite WAL replication — steady, small, and bounded by design.
    mem_limit: 192m
    memswap_limit: 192m
    restart: unless-stopped
    volumes:
      - amux-data:/root/.amux
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: "${R2_ACCESS_KEY}"
      LITESTREAM_SECRET_ACCESS_KEY: "${R2_SECRET_KEY}"
      USER_ID: "${USER_ID}"
    command: replicate
    depends_on:
      amux:
        condition: service_healthy

  sync:
    image: amazon/aws-cli:latest
    container_name: amux-sync-${USER_ID}
    # aws-cli in a sleep loop. s3 sync streams, so this does not grow with the
    # size of the workspace being synced.
    mem_limit: 192m
    memswap_limit: 192m
    restart: unless-stopped
    volumes:
      - amux-data:/root/.amux
    environment:
      AWS_ACCESS_KEY_ID: "${R2_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${R2_SECRET_KEY}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 60
          aws s3 sync /root/.amux/ s3://amux-cloud-users/users/${USER_ID}/files/ --endpoint-url ${R2_ENDPOINT} --exclude 'amux.db' --exclude 'amux.db-shm' --exclude 'amux.db-wal' --exclude 'logs/*' --exclude 'board/*' --quiet
        done
    depends_on:
      amux:
        condition: service_healthy

volumes:
  root-home:
    name: root-home-${USER_ID}
  amux-data:
    name: amux-data-${USER_ID}
