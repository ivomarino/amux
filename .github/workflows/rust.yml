name: rust
# CI for the Rust rebuild (Phase 0 seed of the RR-Phase-10 pipeline).
# Grows stages as phases land: Playwright golden scenarios, perf baselines,
# migration rehearsal. Every stage here must be able to FAIL (ethos rule 7).
on:
  push:
    branches: [main]
    # `amux` + `scripts/**` are here so the CLI gates below (shellcheck + the AF-78
    # launch smoke) actually FIRE when the bash CLI or its tests change. Without them
    # a PR that touched ONLY `amux` (the exact way AMUX-3145 was reintroduced) ran
    # neither gate, so the guard existed but never met the file it guards. The cost is
    # that a CLI-only change also runs the cargo + e2e jobs; over-covering is the safe
    # direction for a gate.
    # `eslint.config.mjs` is here because the e2e job's SPA static gate
    # (scripts/spa-lint.sh) READS it for the vendor-global allowlist, but it lives
    # at repo root, outside every other pattern. Without it a fix to the lint
    # config alone could not re-trigger the very gate it fixes, so a red spa-lint
    # stayed red after the fix landed (32c416b: whitelisting XLSX did not re-run CI).
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'e2e/**', 'amux', 'scripts/**', 'eslint.config.mjs', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'e2e/**', 'amux', 'scripts/**', 'eslint.config.mjs', '.github/workflows/rust.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace
      # AF-74. The `amux` bash CLI is a shipped client with no compiler behind
      # it, and `bash -n` (the pre-commit gate) proves the file PARSES, not that
      # its names resolve. This catches the classes shellcheck CAN see.
      #
      # IT DOES NOT COVER AMUX-3145, the incident that motivated the card, and
      # that is measured, not assumed: I rebuilt the specimen (deleted the
      # `local AMUX_API=...` decl from cmd_start so the later use is unbound)
      # and this gate exits 0 on it. SC2154 only fires for a name assigned
      # NOWHERE in the file; `AMUX_API` is assigned in other functions, and
      # shellcheck does not do per-function `local` scope analysis. A comment
      # here claiming it guards the unbound-var class would be exactly the
      # theatre ethos rule 7 is about. That class needs a runtime smoke test
      # (mocked tmux, AMUX_API unset, reach the real inject) -- filed as AF-78.
      #
      # -e excludes the 9 findings present when this landed, each deliberate:
      #   SC1090 dynamic `source`; SC2016 single-quoted python heredocs (the
      #   whole point is NOT expanding); SC2221/SC2222 overlapping case globs in
      #   the sign-in matcher; SC2015 two intentional A && B || C; SC1039 an
      #   indented heredoc terminator.
      # A DENY-LIST on purpose: a new code fails the build instead of being
      # silently absorbed, which is what an allow-list would do.
      - name: shellcheck the amux CLI (new classes only; NOT the AMUX-3145 scope shape)
        run: shellcheck -S warning -e SC1090,SC2016,SC2221,SC2222,SC2015,SC1039 amux
      # AF-78. The shellcheck step above says in its own name what it cannot see: the
      # AMUX-3145 scope shape, a `local` USED outside the function that declared it.
      # SC2154 fires only for a name assigned NOWHERE in the file, and AMUX_API is
      # `local`-assigned in five other functions, so shellcheck exits 0 on it while
      # `set -euo pipefail` makes the out-of-scope use a hard "unbound variable" at
      # launch. This runtime smoke runs the REAL non-dry-run launch path (tmux stubbed,
      # AMUX_API unset, no fleet touched) so that shape surfaces as a non-zero exit, and
      # it carries its own negative control (a deliberately-broken copy with the
      # declaration deleted) so the check provably CAN fail (ethos rule 7). It
      # complements the static gate; it does not replace it.
      - name: runtime smoke -- CLI launch unbound-var (the AMUX-3145 scope shape shellcheck cannot see)
        run: bash scripts/test-cli-launch-unbound.sh
      # AF-120: the frustrations audit existed, detected its failure class
      # precisely (a headingless append folds into the previous entry and
      # vanishes from every census), and NOTHING RAN IT — six malformed
      # entries landed on main while the purpose-built check sat unread.
      # This step is its CI consumer; the pre-commit hook is the local one.
      # Exit contract (the script's own docstring, which the first wiring of
      # this step did not read): 0 clean, 1 structural problems (decidable
      # with NO board, so it must fail here), 2 board unreachable with
      # structure clean — CI never has a board, so 2 is this environment's
      # green. Failing on 2 turned the consumer red on every push (33b92a5).
      - name: frustrations.md structural audit + its own test suite (AF-120)
        run: |
          set +e
          python3 scripts/frustrations_audit.py > /dev/null
          rc=$?
          set -e
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            python3 scripts/frustrations_audit.py | head -20
            exit "$rc"
          fi
          bash scripts/test-frustrations-audit.sh

      # MHC-377. `amux board status-update <ID> --outcome-file <path>` used to
      # record the literal flag string, print "status update posted" and exit 0,
      # losing the file. Silent, on the success path, and shellcheck cannot see
      # it because `local text="$*"` is valid shell. Sixteen writes were lost to
      # it across two sessions before anyone read a field back. Pins both
      # directions: the flag shapes must refuse without POSTing, and prose,
      # --stdin and --file must reach the wire byte-for-byte.
      - name: runtime smoke -- board status-update refuses flag-shaped prose (MHC-377 data loss)
        run: bash scripts/test-cli-status-update-flags.sh

  e2e:
    # PR Full Gate tier (plan §CI tiers): the golden scenarios in a real
    # browser against the real server + real extracted dashboard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        # webkit is NOT optional: the ios-safari project (devices['iPhone 15'])
        # is a webkit project, and this job runs EVERY project (no --project
        # filter below). A missing browser is a hard error, not a skip:
        # "browserType.launch: Executable doesn't exist at .../webkit-2336".
        # Installing it here rather than gating the project to skip is
        # deliberate — a skipping ios-safari target reads as covered and is
        # worse than none, and the whole reason that project exists is that
        # desktop+mobile chromium at 375px went green while the real phone was
        # broken (AMUX-3057).
        run: npm ci --ignore-scripts 2>/dev/null || npm install; npx playwright install --with-deps chromium webkit
      - name: SPA static gate (no-undef kills the silent-dead-handler class)
        # Two silent-dead-handler bugs shipped in one week (schedule delete,
        # worker delete 2026-08-09): an undefined name in an async handler makes
        # the click do nothing. This gate fails the build on that class.
        run: bash scripts/spa-lint.sh
      # The CI checkout IS committed HEAD, so serve-head's worktree hop is
      # pure duplicate work here — and worse: without these env vars the
      # prebuild below went to ./target while serve-head defaulted to
      # ~/.amux/rust-build-target, so CI paid a SECOND, uncached cold build
      # inside the webServer boot on every run (the old step comment claimed
      # the profile was "shared with webServer"; it stopped being true the
      # day serve-head started setting CARGO_TARGET_DIR — AMUX-2961).
      - name: Build server (the exact debug profile the webServer boots)
        run: cargo build -p amux-server
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Golden scenarios (desktop + mobile + ios-safari)
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          AMUX_E2E_WORKING_TREE: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
