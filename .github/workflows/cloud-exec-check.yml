name: Cloud exec check (tmux ground truth)

# Reads what is ACTUALLY inside a user container — tmux sessions and session
# env files — rather than trusting the gateway API. Used when the UI and the
# API disagree about what exists.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'org id (container amux-user-<org>)'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H 34.121.177.76 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect container
        env:
          ORG: ${{ inputs.org }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 "ORG='$ORG' bash -s" <<'ENDSSH'
            C="amux-user-${ORG}"
            echo "container: $C"
            docker ps --filter "name=$C" --format '  id={{.ID}} status={{.Status}} image={{.Image}}'
            echo
            echo "=== tmux list-sessions (ground truth) ==="
            docker exec "$C" tmux list-sessions 2>&1 | sed 's/^/  /'
            echo
            echo "=== ~/.amux/sessions/*.env (what amux thinks exists) ==="
            docker exec "$C" sh -lc 'ls -1 /root/.amux/sessions/ 2>&1' | sed 's/^/  /'
            echo
            echo "=== workspace files ==="
            docker exec "$C" sh -lc 'ls -la /root/wexus 2>&1 | head -20' | sed 's/^/  /'
            echo
            echo "=== agent output dir ==="
            docker exec "$C" sh -lc 'ls -R /root/wexus/docs/results 2>&1 | head -25' | sed 's/^/  /'
            echo
            echo "=== what the container's own API returns ==="
            docker exec "$C" sh -lc 'curl -s localhost:8822/api/sessions | head -c 600' | sed 's/^/  /'
          ENDSSH
