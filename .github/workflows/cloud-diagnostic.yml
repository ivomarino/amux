name: Cloud diagnostic (read-only)

# Sessions have no working SSH to the cloud host (the local amux_cloud key is
# rejected; gcloud needs an interactive reauth), but CI holds a working key.
# Runs a fixed, read-only set of checks and prints ONLY booleans and counts —
# never a secret value.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H 34.121.177.76 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Read-only checks
        run: |
          cat > /tmp/diag.sh <<'SCRIPT'
          set +x
          set -a; . /etc/amux/gateway.env; set +a
          echo "=== gateway config (presence only) ==="
          for v in ANTHROPIC_API_KEY STRIPE_SECRET_KEY STRIPE_PRO_PRICE_ID STRIPE_ANNUAL_PRICE_ID STRIPE_PLATFORM_FEE_PRICE_ID; do
            if [ -n "${!v}" ]; then echo "  $v: SET"; else echo "  $v: (empty)"; fi
          done
          echo "  ADMIN_EMAILS: ${ADMIN_EMAILS}"
          echo
          echo "=== Stripe: is anyone paying? ==="
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "  no key configured"
          else
            curl -s -u "$STRIPE_SECRET_KEY:" "https://api.stripe.com/v1/subscriptions?status=all&limit=100&expand[]=data.customer" > /tmp/s.json
            AMUX_PRICES="$STRIPE_PRO_PRICE_ID,$STRIPE_ANNUAL_PRICE_ID" python3 - <<'PYEOF'
          import json, os
          prices = {p for p in os.environ.get("AMUX_PRICES","").split(",") if p}
          subs = json.load(open("/tmp/s.json")).get("data", [])
          print(f"  total subscriptions on this Stripe account: {len(subs)}")
          amux = []
          for s in subs:
              items = [i.get("price", {}).get("id") for i in s.get("items", {}).get("data", [])]
              if prices & set(items):
                  amux.append(s)
          print(f"  subscriptions using an amux price id: {len(amux)}")
          for s in amux:
              c = s.get("customer") or {}
              em = c.get("email") if isinstance(c, dict) else c
              print(f"     {s.get('id')} status={s.get('status')} email={em}")
          if not amux:
              print("  -> NOBODY has ever subscribed to amux; the rest belong to other Mixpeek products.")
          PYEOF
            rm -f /tmp/s.json
          fi
          echo
          echo "=== containers / disk ==="
          echo "  running amux containers: $(docker ps --filter name=amux-user- -q | wc -l)"
          echo "  user data dirs: $(ls -1 /var/amux/users 2>/dev/null | wc -l)"
          df -h /var 2>/dev/null | tail -1 | awk '{print "  /var usage: "$5" of "$2}'
          SCRIPT
          ssh -i ~/.ssh/amux_cloud root@34.121.177.76 'bash -s' < /tmp/diag.sh
